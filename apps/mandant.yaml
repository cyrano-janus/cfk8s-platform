# Ein Mandant: Namespace, ServiceAccount, Rolle.
#
# MANDANT wird von ops/apps-tenant.sh ersetzt - die Datei ist eine Vorlage und
# wird nicht von Hand angewendet.
#
# Die Rolle ist bewusst knapp. Ein Mandant soll Anwendungen ausrollen und seine
# Datenbank betreiben koennen; er soll NICHT den Cluster sehen, andere
# Namespaces betreten oder Rechte vergeben. Was hier fehlt, fehlt mit Absicht.
apiVersion: v1
kind: Namespace
metadata:
  name: MANDANT
  labels:
    mandant: MANDANT
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: MANDANT-deployer
  namespace: MANDANT
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: MANDANT
rules:
  # Das Uebliche, um eine Anwendung auszurollen und nachzusehen, warum sie
  # nicht laeuft.
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, services, configmaps, secrets, persistentvolumeclaims, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  # Die eigene Datenbank - derselbe Operator wie auf der Plattform.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, poolers, backups, scheduledbackups]
    verbs: [get, list, watch, create, update, patch, delete]
  # Geheimnisse aus dem Speicher holen. Ein ExternalSecret sagt "hol Feld X
  # aus Pfad Y"; der Operator legt daraus ein Kubernetes-Secret an. Ohne
  # dieses Recht kann ein Mandant den Geheimnisspeicher nicht benutzen -
  # gemessen beim ersten Versuch: `kubectl auth can-i create externalsecrets`
  # antwortete "no", und die Einrichtung waere fuer ihn wertlos gewesen.
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Den SecretStore nur LESEN. Er wird beim Anlegen des Mandanten erzeugt und
  # zeigt auf dessen Pfad; ihn aendern zu duerfen, braeuchte niemand. Die
  # eigentliche Grenze liegt ohnehin woanders - selbst ein umgebogener
  # SecretStore bekaeme nichts, weil die Policy in OpenBao an die Anmelderolle
  # gebunden ist und nur den eigenen Pfad erlaubt.
  - apiGroups: [external-secrets.io]
    resources: [secretstores]
    verbs: [get, list, watch]
  # Lesen, was die eigene Rolle erlaubt. Ohne das kann ein Mandant nicht
  # nachsehen, was er darf, und raet stattdessen.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: MANDANT
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: MANDANT-deployer
    namespace: MANDANT
---
# Das Token. Seit Kubernetes 1.24 legt ein ServiceAccount keines mehr von
# selbst an; ohne dieses Secret bliebe die Kubeconfig leer.
apiVersion: v1
kind: Secret
metadata:
  name: MANDANT-deployer-token
  namespace: MANDANT
  annotations:
    kubernetes.io/service-account.name: MANDANT-deployer
type: kubernetes.io/service-account-token
