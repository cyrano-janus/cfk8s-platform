# Was der Observability-Cluster braucht, um hier hereinzusehen.
#
# Ein eigener ServiceAccount mit genau zwei Rechten - Metriken lesen. Er darf
# NICHTS aendern und keine Objektinhalte sehen; `nodes/metrics` und
# `nodes/stats` sind Leserechte auf Zahlen, nicht auf Daten.
apiVersion: v1
kind: Namespace
metadata:
  name: metrics-access
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-scraper
  namespace: metrics-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-scraper
rules:
  - apiGroups: [""]
    resources: [nodes/metrics, nodes/stats]
    verbs: [get]
  # Der /metrics-Endpunkt des API-Servers selbst liegt nicht unter einer
  # Ressource, sondern unter einem Pfad - dafuer gibt es nonResourceURLs.
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-scraper
subjects:
  - kind: ServiceAccount
    name: prometheus-scraper
    namespace: metrics-access
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-scraper-token
  namespace: metrics-access
  annotations:
    kubernetes.io/service-account.name: prometheus-scraper
type: kubernetes.io/service-account-token
---
# Zwei Knotenports, damit der Nachbarcluster an die beiden HTTP-Endpunkte
# kommt. Der kubelet braucht keinen - er lauscht selbst auf 10250.
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-metrics-extern
  namespace: ingress-nginx
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 10254
      targetPort: metrics
      nodePort: 30254
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-extern
  namespace: metrics-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
