# Werte fuer ingress-nginx in einem kind-Cluster.
#
# Der Controller laeuft mit hostPort statt hinter einem LoadBalancer: kind
# bringt keinen mit, und ein Service vom Typ LoadBalancer bliebe ewig
# "pending". Ueber hostPort erreicht der Verkehr vom Wirt (8080/8443) den
# Controller im Knoten (80/443).
controller:
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
  service:
    type: ClusterIP
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule
  # Ein Knoten, ein Controller - mehr Repliken haetten keinen Platz und
  # blieben Pending.
  replicaCount: 1
  # ERSETZEN statt rollend ersetzen. Mit hostPort und einem einzigen Knoten
  # endet ein RollingUpdate im Stillstand: der alte Pod haelt 80 und 443, der
  # neue bleibt Pending mit "didn't have free ports", und Helm wartet bis zum
  # Timeout auf etwas, das nie eintritt. Gemessen beim Einschalten der
  # Metriken. Der Preis sind wenige Sekunden ohne Ingress bei jeder Aenderung -
  # in einem Entwicklungscluster der bessere Tausch.
  updateStrategy:
    type: Recreate
  ingressClassResource:
    name: nginx
    enabled: true
    # DER STANDARD - sonst bleibt jeder Ingress ohne ausdrueckliche Klasse
    # unbedient, und zwar lautlos: der Controller ignoriert ihn, und der Aufruf
    # endet in einem 404, das wie ein Tippfehler in der Adresse aussieht.
    # Gemessen genau so, beim ersten Mandanten-Versuch. Ein Mandant soll
    # `kubectl create ingress ...` tippen koennen, ohne eine Klasse zu kennen.
    default: true
  metrics:
    # Ohne diese Zeile hat der Controller keinen /metrics-Endpunkt, und der
    # Observability-Cluster saehe nicht, welche Anwendung wie oft aufgerufen
    # wird - die interessanteste Zahl in einem Mandanten-Cluster.
    enabled: true
    port: 10254
  admissionWebhooks:
    # Der Webhook prueft Ingress-Objekte beim Anlegen. In einem
    # Entwicklungscluster kostet er beim Aufbau mehr Zeit, als er an
    # Tippfehlern spart - und ein halb gestarteter Webhook laesst jedes
    # `kubectl apply` eines Ingress auflaufen.
    enabled: false
