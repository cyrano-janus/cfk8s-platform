# Eine eigene nginx.conf ist hier Absicht und nicht Zierde: sie ist die
# Detect-Bedingung des nginx-Buildpacks. Der Alternativweg wäre
# BP_WEB_SERVER=nginx als BUILD-Env — und ob Korifi App-Env bis in den
# kpack-Build durchreicht, wäre eine Wette. Eine Datei im Quellbaum ist es nicht.
#
# Erkannt wird damit Order-Gruppe 5 des web-servers-Composites
# (ca-certificates*, watchexec*, nginx, procfile*, ...) — der Pfad ohne Node.
#
# {{port}} rendert das Buildpack aus PORT. Verifiziert: das Templating greift.
#
# Kein `include mime.types`: relative include-Pfade löst nginx gegen sein prefix
# auf, und das ist hier /workspace (der App-Quellbaum), nicht das nginx-Layer.
# Der erste Versuch scheiterte genau daran:
#   [emerg] open() "/workspace/mime.types" failed (2: No such file or directory)
# Für einen einzigen Inhaltstyp genügt default_type; ein Pfad ins Layer wäre
# ohnehin nicht stabil.
worker_processes auto;
daemon off;

events {
  worker_connections 1024;
}

http {
  charset utf-8;
  default_type application/json;
  access_log /dev/stdout;

  server {
    listen {{port}};
    root public;
    index index.json;
  }
}
