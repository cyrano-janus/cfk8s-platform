# inotify-Kapazität für kind-Cluster.
#
# Jeder Controller im Cluster hält eigene inotify-Instanzen: kpack, cert-manager,
# die Korifi-Reconciler, containerd. Zwei parallele kind-Cluster verdoppeln das.
# Der Kernel-Default von 128 Instanzen reicht dafür nicht.
#
# Wird das Limit erreicht, gibt es keine Fehlermeldung: Watches werden einfach
# nicht mehr eingerichtet, Reconciles bleiben aus, und der Cluster wirkt langsam
# statt kaputt. Genau deshalb steht der Wert hier und nicht in einem
# `sysctl -w`-Aufruf — der ist nach dem nächsten Reboot weg.
#
# Einmalig installieren:
#   sudo cp host/99-kind-inotify.conf /etc/sysctl.d/
#   sudo sysctl --system
fs.inotify.max_user_instances = 512
fs.inotify.max_user_watches = 524288
