# Zugang für eine Anwendung, die in diesem Cluster eine Datenbank betreibt.
#
# WARUM ES DAS GIBT
#
# Was `kind get kubeconfig` liefert, ist cluster-admin: wer es hat, kann CF,
# den Broker, cert-manager und die Operatoren ändern und löschen. Für "eine App
# legt sich eine Datenbank an" ist das zu viel, und vor allem ist es nicht
# widerrufbar - ein cluster-admin-Zertifikat aus kind hat kein Ablaufdatum und
# keine Sperrliste. Der einzige Widerruf wäre der Neubau des Clusters.
#
# Hier steht deshalb ein eigener Mandant: ein Namespace, ein ServiceAccount,
# Rechte NUR in diesem Namespace. Widerruf ist das Löschen eines Tokens.
#
# ABGRENZUNG ZU osb-instances
#
# Der Namespace der Broker-Instanzen (INSTANCE_NAMESPACE) gehört dem Broker.
# Wer dort schreibt, verfälscht die Befunde, die diese Plattform protokolliert:
# eine Datenbank, die nicht der Broker angelegt hat, sähe in einer Prüfung wie
# eine aus. Die App bekommt darum einen eigenen Namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ${APP_NAMESPACE}
  labels:
    # Kennzeichnet den Namespace als NICHT vom Broker verwaltet. `make verify`
    # und die Katalogprüfungen sehen nur osb-instances an - diese Marke hält
    # die Trennung auch für den Menschen sichtbar.
    cfk8s.local/owner: application
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP_SERVICE_ACCOUNT}
  namespace: ${APP_NAMESPACE}
---
# Das Token. Seit Kubernetes 1.24 legt ein ServiceAccount von sich aus kein
# Secret mehr an; ein langlebiges Token entsteht nur noch über ein Secret
# dieses Typs mit dieser Annotation.
#
# Kurzlebige Token (`kubectl create token`) wären der bessere Stil, verlangen
# aber eine Erneuerung im Betrieb. Für einen lokalen Entwicklungscluster, an
# dem eine App über Tage gebaut wird, wiegt das schwerer als der Gewinn - und
# der Widerruf bleibt in beiden Fällen gleich einfach: Secret löschen.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP_SERVICE_ACCOUNT}-token
  namespace: ${APP_NAMESPACE}
  annotations:
    kubernetes.io/service-account.name: ${APP_SERVICE_ACCOUNT}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${APP_SERVICE_ACCOUNT}
  namespace: ${APP_NAMESPACE}
rules:
  # --- Die Datenbank selbst -------------------------------------------------
  # Der CNPG-Operator läuft cluster-weit und hört auf Cluster-Objekte in jedem
  # Namespace. Die App braucht deshalb kein Recht AM Operator, nur an seinen
  # Objekten hier.
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - clusters
      - databases
      - poolers
      - backups
      - scheduledbackups
      - publications
      - subscriptions
      - databaseroles
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- Die Zugangsdaten der Datenbank --------------------------------------
  # CNPG legt Benutzer, Passwort und die CA der Datenbank als Secrets im selben
  # Namespace ab (<cluster>-app, <cluster>-ca ...). Ohne Leserecht darauf kommt
  # die App nicht an ihr eigenes Passwort - die Datenbank stünde, wäre aber
  # unbenutzbar. Das Recht endet am Namespace: Secrets von CF, vom Broker oder
  # der Plattform-PKI sind damit nicht erreichbar.
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- Die Anwendung, falls sie mit im Cluster liegt ------------------------
  # Wer die Datenbank hier betreibt, stellt üblicherweise auch die App daneben.
  # Innerhalb eines eigenen Namespace kostet das nichts zusätzlich.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- Sehen, was passiert --------------------------------------------------
  # Pods werden von CNPG und von den Deployments erzeugt, nicht von Hand; die
  # App muss sie lesen und ihre Logs holen können, um einen fehlgeschlagenen
  # Start zu erklären. `delete` bleibt erlaubt, weil ein Neustart eines Pods
  # das übliche Mittel ist; `create` nicht - ein Pod ohne Controller wäre ein
  # Zustand, den niemand mehr aufräumt.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "events"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${APP_SERVICE_ACCOUNT}
  namespace: ${APP_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${APP_SERVICE_ACCOUNT}
subjects:
  - kind: ServiceAccount
    name: ${APP_SERVICE_ACCOUNT}
    namespace: ${APP_NAMESPACE}
